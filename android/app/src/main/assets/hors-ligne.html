<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pas de connexion</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#14213d;--mute:#56627a;--c:#2b579a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#162238;--ink:#eaf0fb;--mute:#9aa8c2;--c:#6d9be8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
.b{background:var(--card);border-radius:14px;padding:28px 22px;max-width:360px;box-shadow:0 2px 10px rgb(0 0 0/.06)}
h1{font-size:22px;margin:10px 0 6px;color:var(--c)}p{color:var(--mute);margin:0 0 18px}
button{background:var(--c);color:#fff;border:0;border-radius:10px;padding:13px 22px;font:600 16px system-ui,sans-serif;width:100%}
.i{font-size:44px}
</style></head><body><div class="b"><div class="i" aria-hidden="true">📶</div><h1>Pas de connexion Internet</h1>
<p>Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez. Les fichiers déjà téléchargés restent disponibles dans « Téléchargements / Fahimta ».</p>
<button onclick="FahimtaAndroid.reessayer()">Réessayer</button></div></body></html>
