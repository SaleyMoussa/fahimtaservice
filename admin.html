<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace équipe – Fahimta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w">
<h1>Espace équipe</h1>
<form id="L" class="g"><label>E-mail<input id="u" type="email" required autocomplete="username"></label><label>Mot de passe<input id="p" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Se connecter</button></form>
<p id="E" class="ko" role="alert"></p>
<div id="A" hidden><div class="tabs" id="T"></div><div id="V"></div></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
var me,cid=null,S=['Nouvelle','Contactée','Payée','Inscrite','Annulée'];
var TB={ins:['Inscriptions',['admin','gestionnaire']],crs:['Cours',['admin','responsable']],acc:['Accès et suivi',['admin','gestionnaire','responsable']],usr:['Utilisateurs',['admin']]};
var V={ins:vIns,crs:vCrs,acc:vAcc,usr:vUsr};
function E(t){$('E').textContent=t}
if(!window.SB_URL){$('L').hidden=true;E('Connexion impossible : le fichier config.js est absent ou vide (SB_URL et SB_KEY).')}else if(A.tok)boot();
$('L').onsubmit=async function(e){e.preventDefault();E('Connexion…');try{await A.login($('u').value.trim(),$('p').value);E('');boot()}catch(x){E('E-mail ou mot de passe incorrect.')}};
async function boot(){try{me=(await A.q('profiles?id=eq.'+A.uid()+'&select=*'))[0];
if(!me||['admin','gestionnaire','responsable'].indexOf(me.role)<0){A.out();E('Accès réservé à l\'équipe. Demandez à la direction de vous attribuer un rôle.');return}
$('L').hidden=true;$('A').hidden=false;var h='',f=null;for(var k in TB)if(TB[k][1].indexOf(me.role)>-1){if(!f)f=k;h+='<button class="btn o" data-t="'+k+'">'+TB[k][0]+'</button>'}
$('T').innerHTML=h+'<button class="btn" id="O">Déconnexion</button>';go(f)}
catch(x){A.out();$('L').hidden=false;E('Session expirée, reconnectez-vous.')}}
$('T').onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.id=='O'){A.out();location.reload()}else if(b.dataset.t){cid=null;go(b.dataset.t)}};
function go(t){V[t]().catch(function(x){$('V').innerHTML='<p class="ko">Erreur : '+esc(x.message)+'</p>'})}
var D=[];
async function vIns(){D=await A.q('inscriptions?select=*&order=created_at.desc');
$('V').innerHTML='<div class="srch"><input id="s" type="search" placeholder="Rechercher…"><button class="btn o" data-a="x">Exporter CSV</button></div><p class="m" id="n"></p><div id="R"></div>';
$('s').oninput=dIns;dIns()}
function dIns(){var q=$('s').value.toLowerCase(),L=D.filter(function(d){return JSON.stringify(d).toLowerCase().indexOf(q)>-1});$('n').textContent=L.length+' inscription(s)';
$('R').innerHTML=L.map(function(d){return '<div class="card"><h3>'+esc(d.prenom)+' '+esc(d.nom)+'</h3><p class="m">'+esc(d.formation)+' · '+esc(d.niveau_souhaite)+' · '+esc(d.mode)+'</p><p class="m">'+esc(d.duree_jours)+' jours · début '+esc(d.date_debut)+' · reçue le '+esc((d.created_at||'').slice(0,10))+'</p><p><a href="tel:'+esc(d.telephone)+'">'+esc(d.telephone)+'</a></p><details><summary>Détails</summary><p class="m">'+esc(d.sexe)+' · '+esc(d.niveau_etudes)+'<br>Né(e) le '+esc(d.date_naissance)+' à '+esc(d.lieu_naissance)+'<br>'+esc(d.nationalite)+'<br>'+esc(d.email)+'<br>Frais : '+esc(d.frais)+'</p></details><select data-s="'+d.id+'" aria-label="Statut">'+S.map(function(s){return '<option'+(s==d.statut?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'}).join('')}
async function vCrs(){if(cid)return vLes();
var C=await A.q('courses?select=*&order=id.desc'+(me.role=='admin'?'':'&created_by=eq.'+A.uid()));
$('V').innerHTML='<h2>Nouveau cours</h2><form id="NC" class="g"><input id="ct" placeholder="Titre du cours" required><textarea id="cd" placeholder="Description" rows="3"></textarea><input id="cp" placeholder="Prix (ex. 10 000 FCFA / mois)"><button class="btn">Créer le cours</button></form><h2>Cours</h2>'+(C.map(function(c){return '<div class="card"><h3>'+esc(c.titre)+'</h3><p class="m">'+esc(c.prix)+' · '+(c.publie?'Publié':'Brouillon')+'</p><button class="btn" data-a="o" data-i="'+c.id+'">Leçons et évaluations</button> <button class="btn o" data-a="p" data-i="'+c.id+'" data-v="'+(c.publie?0:1)+'">'+(c.publie?'Dépublier':'Publier')+'</button></div>'}).join('')||'<p class="m">Aucun cours pour le moment.</p>');
$('NC').onsubmit=async function(e){e.preventDefault();try{await A.q('courses','POST',{titre:$('ct').value.trim(),description:$('cd').value.trim(),prix:$('cp').value.trim(),created_by:A.uid()},'return=minimal');vCrs()}catch(x){alert('Erreur : '+x.message)}}}
function qt(z){return (z||[]).map(function(x){return [x.q,x.o.join(' ; '),x.a+1,x.e||''].join(' | ')}).join('\n')}
function qp(t){return t.split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){var p=s.split('|').map(function(x){return x.trim()});return {q:p[0],o:(p[1]||'').split(';').map(function(x){return x.trim()}).filter(Boolean),a:(parseInt(p[2])||1)-1,e:p[3]||''}})}
async function vLes(){var r=await Promise.all([A.q('courses?id=eq.'+cid+'&select=titre'),A.q('lessons?course_id=eq.'+cid+'&order=position&select=*')]),Ls=r[1];
$('V').innerHTML='<p><button class="btn o" data-a="b">← Cours</button></p><h2>'+esc(r[0][0].titre)+'</h2><p class="m">Évaluation : une question par ligne, au format<br><b>Question | Choix 1 ; Choix 2 ; Choix 3 | n° de la bonne réponse | Explication</b></p>'+Ls.map(function(l){return '<div class="card"><input id="t'+l.id+'" value="'+esc(l.titre)+'" aria-label="Titre"><textarea id="c'+l.id+'" rows="8" placeholder="Contenu de la leçon (séparez les paragraphes par une ligne vide)">'+esc(l.contenu)+'</textarea><textarea id="z'+l.id+'" rows="4" placeholder="Évaluation (facultative)">'+esc(qt(l.quiz))+'</textarea><button class="btn" data-a="sv" data-i="'+l.id+'">Enregistrer</button> <button class="btn o" data-a="del" data-i="'+l.id+'">Supprimer</button></div>'}).join('')+'<button class="btn" data-a="add" data-i="'+(Ls.length+1)+'">+ Ajouter une leçon</button>'}
async function vAcc(){var r=await Promise.all([A.q('enrollments?select=*,profiles(nom,prenom,email),courses(titre)&order=created_at.desc'),A.q('lessons?select=id,course_id'),A.q('progress?select=user_id,course_id,done,score,total')]);
$('V').innerHTML='<p class="m">'+r[0].length+' demande(s) d\'accès</p>'+r[0].map(function(e){var pr=e.profiles||{},tot=r[1].filter(function(l){return l.course_id==e.course_id}).length,P=r[2].filter(function(p){return p.user_id==e.user_id&&p.course_id==e.course_id}),d=P.filter(function(p){return p.done}).length,Q=P.filter(function(p){return p.total>0}),m=Q.length?Math.round(100*Q.reduce(function(s,p){return s+p.score/p.total},0)/Q.length):null,on=e.statut=='actif';
return '<div class="card"><h3>'+esc(pr.prenom)+' '+esc(pr.nom)+'</h3><p class="m">'+esc((e.courses||{}).titre)+' · '+esc(pr.email)+'</p><p>'+d+' / '+tot+' leçons'+(m==null?'':' · score moyen '+m+' %')+'</p><button class="btn'+(on?' o':'')+'" data-a="en" data-i="'+e.id+'" data-v="'+(on?'demande':'actif')+'">'+(on?'Retirer l\'accès':'Activer l\'accès')+'</button> <span class="m">'+esc(e.statut)+'</span></div>'}).join('')}
async function vUsr(){var U=await A.q('profiles?select=*&order=created_at.desc');
$('V').innerHTML='<p class="m">Pour créer un compte équipe : la personne s\'inscrit sur la page Espace apprenant, puis vous lui attribuez un rôle ici.</p>'+U.map(function(u){return '<div class="card"><h3>'+esc(u.prenom)+' '+esc(u.nom)+'</h3><p class="m">'+esc(u.email)+'</p><select data-r="'+u.id+'" aria-label="Rôle">'+['apprenant','responsable','gestionnaire','admin'].map(function(r){return '<option'+(r==u.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></div>'}).join('')}
var ACT={
o:async function(i){cid=+i;vCrs()},b:async function(){cid=null;vCrs()},
p:async function(i,b){await A.q('courses?id=eq.'+i,'PATCH',{publie:b.dataset.v=='1'},'return=minimal');vCrs()},
add:async function(i){await A.q('lessons','POST',{course_id:cid,position:+i,titre:'Nouvelle leçon',contenu:''},'return=minimal');vLes()},
del:async function(i){if(confirm('Supprimer cette leçon ?')){await A.q('lessons?id=eq.'+i,'DELETE',null,'return=minimal');vLes()}},
sv:async function(i){var z=qp($('z'+i).value);if(z.some(function(q){return q.o.length<2||q.a<0||q.a>=q.o.length})){alert('Évaluation invalide : chaque question doit avoir au moins 2 choix et un numéro de bonne réponse valide.');return}
await A.q('lessons?id=eq.'+i,'PATCH',{titre:$('t'+i).value.trim(),contenu:$('c'+i).value,quiz:z},'return=minimal');alert('Leçon enregistrée.')},
en:async function(i,b){await A.q('enrollments?id=eq.'+i,'PATCH',{statut:b.dataset.v},'return=minimal');vAcc()},
x:async function(){var k=['created_at','statut','nom','prenom','sexe','niveau_etudes','date_naissance','lieu_naissance','nationalite','telephone','email','formation','niveau_souhaite','duree_jours','date_debut','mode','frais'],c=[k.join(',')].concat(D.map(function(d){return k.map(function(x){return '"'+String(d[x]==null?'':d[x]).replace(/"/g,'""')+'"'}).join(',')})).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='inscriptions-fahimta.csv';a.click()}};
$('V').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;ACT[b.dataset.a](b.dataset.i,b).catch(function(x){alert('Erreur : '+x.message)})};
$('V').onchange=function(e){var s=e.target;if(s.dataset.s)A.q('inscriptions?id=eq.'+s.dataset.s,'PATCH',{statut:s.value},'return=minimal').catch(function(){alert('Modification non enregistrée.')});
else if(s.dataset.r)A.q('profiles?id=eq.'+s.dataset.r,'PATCH',{role:s.value},'return=minimal').catch(function(){alert('Modification non enregistrée.')})};
</script>
</body>
</html>
