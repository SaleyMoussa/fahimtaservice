$('L').hidden=true;$('A').hidden=false;var h='',f=null;for(var k in TB)if(TB[k][1].indexOf(me.role)>-1){if(!f)f=k;h+='<button class="pill" data-t="'+k+'">'+TB[k][0]+'</button>'}
$('T').innerHTML=h;$('TU').innerHTML='<a href="espace.html">Espace apprenant</a><span class="chip"><span class="av" aria-hidden="true">'+esc((me.prenom||me.email||'?').charAt(0).toUpperCase())+'</span>'+esc(me.prenom||'')+' · '+esc(RL[me.role]||me.role)+'</span><button class="btn o" id="O" type="button">Déconnexion</button>';$('O').onclick=function(){A.out();location.reload()};go(f)}
catch(x){A.out();$('L').hidden=false;E('Session expirée, reconnectez-vous.')}}

var D=[];
async function vIns(){D=await A.q('inscriptions?select=*&order=created_at.desc');
$('V').innerHTML='<div class="srch"><input id="s" type="search" placeholder="Rechercher…"><button class="btn o" data-a="x">Exporter CSV</button></div><p class="m" id="n"></p><div id="R"></div>';
$('s').oninput=dIns;dIns()}

async function vCrs(){if(cid)return vLes();
var r=await Promise.all([A.q('courses?select=*&order=ordre,titre'+(me.role=='admin'?'':'&created_by=eq.'+A.uid())),A.q('course_codes?select=*')]),C=r[0],K={};r[1].forEach(function(k){K[k.course_id]=k.codes});
$('V').innerHTML='<h2>Nouveau cours</h2><form id="NC" class="g"><input id="ct" placeholder="Titre du cours" required aria-label="Titre"><textarea id="cd" placeholder="Description" rows="3" aria-label="Description"></textarea><input id="cp" placeholder="Prix (ex. 10 000 FCFA / mois)" aria-label="Prix"><input id="cc" placeholder="Catégorie (ex. Bureautique)" aria-label="Catégorie"><button class="btn">Créer le cours</button></form><h2>Cours ('+C.length+')</h2><p class="m">Les codes d\'accès ne sont visibles que par les apprenants dont l\'accès est actif. Le bouton « Ouvrir le cours » de leur tableau de bord applique le code automatiquement.</p>'+(C.map(function(c){return '<div class="card"><h3>'+esc(c.titre)+'</h3><p class="m">'+esc([c.categorie,c.niveau,c.prix].filter(Boolean).join(' · '))+' · '+(c.publie?'Publié':'Brouillon')+'</p><details><summary>Modifier le cours et les codes d\'accès</summary><div class="g" style="margin-top:8px"><label>Titre<input id="et'+c.id+'" value="'+esc(c.titre)+'"></label><label>Description<textarea id="ed'+c.id+'" rows="3">'+esc(c.description)+'</textarea></label><label>Prix<input id="ep'+c.id+'" value="'+esc(c.prix)+'"></label><label>Catégorie<input id="ec'+c.id+'" value="'+esc(c.categorie)+'"></label><label>Niveau<input id="en'+c.id+'" value="'+esc(c.niveau)+'"></label><label>Page du cours sur le site<input id="eg'+c.id+'" value="'+esc(c.page)+'" placeholder="ex. cours-word.html"></label><label>Code(s) d\'accès, séparés par des virgules<input id="ek'+c.id+'" value="'+esc(K[c.id]||'')+'" autocomplete="off"></label><button class="btn" data-a="cs" data-i="'+c.id+'">Enregistrer</button></div></details><button class="btn" data-a="o" data-i="'+c.id+'">Leçons et évaluations</button> <button class="btn o" data-a="p" data-i="'+c.id+'" data-v="'+(c.publie?0:1)+'">'+(c.publie?'Dépublier':'Publier')+'</button></div>'}).join('')||'<p class="m">Aucun cours pour le moment.</p>');
$('NC').onsubmit=async function(e){e.preventDefault();try{await A.q('courses','POST',{titre:$('ct').value.trim(),description:$('cd').value.trim(),prix:$('cp').value.trim(),categorie:$('cc').value.trim()||null,created_by:A.uid()},'return=minimal');vCrs()}catch(x){alert('Erreur : '+x.message)}}}
function qt(z){return (z||[]).map(function(x){return [x.q,x.o.join(' ; '),x.a+1,x.e||''].join(' | ')}).join('\n')}
function qp(t){return t.split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){var p=s.split('|').map(function(x){return x.trim()});return {q:p[0],o:(p[1]||'').split(';').map(function(x){return x.trim()}).filter(Boolean),a:(parseInt(p[2])||1)-1,e:p[3]||''}})}
async function vLes(){var r=await Promise.all([A.q('courses?id=eq.'+cid+'&select=titre'),A.q('lessons?course_id=eq.'+cid+'&order=position&select=*')]),Ls=r[1];
$('V').innerHTML='<p><button class="btn o" data-a="b">← Cours</button></p><h2>'+esc(r[0][0].titre)+'</h2><p class="m">Évaluation : une question par ligne, au format<br><b>Question | Choix 1 ; Choix 2 ; Choix 3 | n° de la bonne réponse | Explication</b></p>'+Ls.map(function(l){return '<div class="card"><input id="t'+l.id+'" value="'+esc(l.titre)+'" aria-label="Titre"><textarea id="c'+l.id+'" rows="8" placeholder="Contenu de la leçon (séparez les paragraphes par une ligne vide)">'+esc(l.contenu)+'</textarea><textarea id="z'+l.id+'" rows="4" placeholder="Évaluation (facultative)">'+esc(qt(l.quiz))+'</textarea><button class="btn" data-a="sv" data-i="'+l.id+'">Enregistrer</button> <button class="btn o" data-a="del" data-i="'+l.id+'">Supprimer</button></div>'}).join('')+'<button class="btn" data-a="add" data-i="'+(Ls.length+1)+'">+ Ajouter une leçon</button>'}
async function vSta(){$('V').innerHTML='<p class="m">Chargement des statistiques…</p>';var r=await A.q('rpc/stats_visites','POST',{p_jours:30});
var t=function(k,l,c){var x=r[k]||{v:0,u:0};return '<div class="tile" style="--tc:'+c+'"><b>'+x.v.toLocaleString('fr-FR')+'</b><span>'+l+'<br>'+x.u.toLocaleString('fr-FR')+' visiteur'+(x.u>1?'s':'')+' différent'+(x.u>1?'s':'')+'</span></div>'};
var bars=function(L,lab){var m=Math.max.apply(null,L.map(function(x){return x.v}).concat([1]));return '<div class="chart" role="img" aria-label="Graphique des visites">'+L.map(function(x){return '<i style="height:'+Math.max(2,Math.round(100*x.v/m))+'%" title="'+esc(lab(x))+' : '+x.v+' visites, '+x.u+' visiteurs"></i>'}).join('')+'</div>'};
var days=[],map={};(r.par_jour||[]).forEach(function(x){map[x.d]=x});for(var i=29;i>=0;i--){var d=new Date(Date.now()-i*864e5),k=d.toLocaleDateString('sv-SE',{timeZone:'Africa/Niamey'});days.push(map[k]||{d:k,v:0,u:0})}
var fd=function(k){return new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})},MO=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],fm=function(k){return MO[+k.slice(5,7)-1]+' '+k.slice(0,4)};
$('V').innerHTML='<h2>Visites du site</h2><p class="m">Une visite = une page ouverte par un visiteur (comptée une fois par session). Les visiteurs différents sont reconnus par leur navigateur, de façon anonyme.</p><div class="tiles">'+t('jour','Aujourd\'hui','var(--c)')+t('semaine','Cette semaine','var(--ok)')+t('mois','Ce mois-ci','#c8501f')+t('annee','Cette année','#7a4fb5')+t('total','Depuis le début','var(--mute)')+'</div>'+
'<div class="card" style="border-left-width:1px"><h3>30 derniers jours</h3>'+bars(days,function(x){return fd(x.d)})+'<div class="chl"><span>'+fd(days[0].d)+'</span><span>'+fd(days[29].d)+'</span></div></div>'+
'<div class="card" style="border-left-width:1px"><h3>Par mois</h3>'+((r.par_mois||[]).length?'<table class="tbl"><tr><th>Mois</th><th>Visiteurs</th><th>Visites</th></tr>'+r.par_mois.slice().reverse().map(function(x){return '<tr><td>'+fm(x.m)+'</td><td>'+x.u+'</td><td><b>'+x.v+'</b></td></tr>'}).join('')+'</table>':'<p class="m">Pas encore de données.</p>')+'</div>'+
'<div class="card" style="border-left-width:1px"><h3>Par année</h3>'+((r.par_annee||[]).length?'<table class="tbl"><tr><th>Année</th><th>Visiteurs</th><th>Visites</th></tr>'+r.par_annee.slice().reverse().map(function(x){return '<tr><td>'+x.a+'</td><td>'+x.u+'</td><td><b>'+x.v+'</b></td></tr>'}).join('')+'</table>':'<p class="m">Pas encore de données.</p>')+'</div>'+
'<div class="card" style="border-left-width:1px"><h3>Pages les plus vues (30 jours)</h3>'+((r.pages||[]).length?'<table class="tbl">'+r.pages.map(function(x){return '<tr><td>'+esc(x.p)+'</td><td><b>'+x.v+'</b></td></tr>'}).join('')+'</table>':'<p class="m">Pas encore de données.</p>')+'</div>'}
async function vVid(){var r=await Promise.all([A.q('videos?select=*,courses(titre)&order=ordre,id'),A.q('courses?select=id,titre&order=ordre,titre'),A.q('reglages?cle=eq.youtube&select=valeur')]),Vd=r[0],C=r[1],ch=((r[2]||[])[0]||{}).valeur||'';
var opt=function(sel){return '<option value="">Vidéo générale (page d\'accueil)</option>'+C.map(function(c){return '<option value="'+c.id+'"'+(c.id==sel?' selected':'')+'>'+esc(c.titre)+'</option>'}).join('')};
$('V').innerHTML=(me.role=='admin'?'<h2>Chaîne YouTube</h2><form id="YC" class="g"><label>Lien de votre chaîne<input id="yc" type="url" value="'+esc(ch)+'" placeholder="https://www.youtube.com/@votrechaine"></label><button class="btn">Enregistrer le lien</button></form>':'')+
'<h2>Ajouter une vidéo</h2><form id="NV" class="g"><label>Lien de la vidéo YouTube<input id="vu" type="url" required placeholder="https://www.youtube.com/watch?v=…"></label><label>Titre<input id="vt" required placeholder="ex. Créer un tableau croisé dynamique"></label><label>Cours concerné<select id="vc">'+opt('')+'</select></label><button class="btn">Ajouter la vidéo</button></form>'+
'<h2>Vidéos ('+Vd.length+')</h2><p class="m">Les vidéos s\'affichent sur la page du cours concerné, et les vidéos générales sur la page d\'accueil.</p>'+(Vd.map(function(v){return '<div class="card"><h3>'+esc(v.titre)+'</h3><p class="m">'+esc(v.courses?v.courses.titre:'Vidéo générale')+' · <a href="'+esc(v.url)+'" target="_blank" rel="noopener">Voir sur YouTube</a></p><button class="btn o" data-a="vdel" data-i="'+v.id+'">Supprimer</button></div>'}).join('')||'<div class="empty">Aucune vidéo pour le moment.</div>');
if($('YC'))$('YC').onsubmit=async function(e){e.preventDefault();try{await A.q('reglages?on_conflict=cle','POST',{cle:'youtube',valeur:$('yc').value.trim()},'resolution=merge-duplicates,return=minimal');alert('Lien de la chaîne enregistré.')}catch(x){alert('Erreur : '+x.message)}};
$('NV').onsubmit=async function(e){e.preventDefault();var u=$('vu').value.trim();if(!/youtu\.?be/.test(u)){alert('Collez un lien YouTube (youtube.com ou youtu.be).');return}
try{await A.q('videos','POST',{url:u,titre:$('vt').value.trim(),course_id:$('vc').value?+$('vc').value:null},'return=minimal');vVid()}catch(x){alert('Erreur : '+x.message)}}}
var FS='demande',FQ='';
var ST={demande:['À valider','var(--mute)'],actif:['Actif','var(--c)'],termine:['Terminé','var(--ok)'],refuse:['Refusé','var(--ko)']};
async function vAcc(){var r=await Promise.all([A.q('enrollments?select=*,profiles!enrollments_user_id_fkey(nom,prenom,email),courses(titre)&order=created_at.desc'),A.q('lessons?select=id,course_id'),A.q('progress?select=user_id,course_id,done,score,total')]);ACC=r;
var n={};r[0].forEach(function(e){n[e.statut]=(n[e.statut]||0)+1});
$('V').innerHTML='<div class="pills" id="FS">'+['demande','actif','termine','refuse',''].map(function(k){return '<button class="pill'+(k==FS?' on':'')+'" data-f="'+k+'">'+(k?ST[k][0]:'Tous')+' ('+(k?n[k]||0:r[0].length)+')</button>'}).join('')+'</div><div class="srch"><input id="fq" type="search" placeholder="Rechercher un apprenant ou un cours" value="'+esc(FQ)+'" aria-label="Rechercher"></div><div id="AL"></div>';dAcc()}
var ACC=[[],[],[]];
function dAcc(){var q=FQ.toLowerCase(),L=ACC[0].filter(function(e){var pr=e.profiles||{};return (!FS||e.statut==FS)&&(!q||[pr.nom,pr.prenom,pr.email,(e.courses||{}).titre].join(' ').toLowerCase().indexOf(q)>-1)});
var d=function(s){return s?new Date(s).toLocaleDateString('fr-FR'):''};
$('AL').innerHTML=(L.length?'':'<p class="m">Aucun apprenant dans cette liste.</p>')+L.map(function(e){var pr=e.profiles||{},tot=ACC[1].filter(function(l){return l.course_id==e.course_id}).length,P=ACC[2].filter(function(p){return p.user_id==e.user_id&&p.course_id==e.course_id}),dn=P.filter(function(p){return p.done}).length,Q=P.filter(function(p){return p.total>0}),m=Q.length?Math.round(100*Q.reduce(function(s,p){return s+p.score/p.total},0)/Q.length):null,st=ST[e.statut]||[e.statut,'var(--mute)'],b='';
if(e.statut=='demande')b='<button class="btn" data-a="en" data-i="'+e.id+'" data-v="actif">Activer l\'accès</button> <button class="btn o" data-a="en" data-i="'+e.id+'" data-v="refuse">Refuser</button>';
else if(e.statut=='actif')b='<button class="btn" data-a="fin" data-i="'+e.id+'">Valider la fin du cours</button> <button class="btn o" data-a="en" data-i="'+e.id+'" data-v="demande">Retirer l\'accès</button>';
else if(e.statut=='termine')b='<a class="btn" style="display:inline-block;text-decoration:none" href="attestation.html?e='+e.id+'" target="_blank">Voir l\'attestation</a> <button class="btn o" data-a="en" data-i="'+e.id+'" data-v="actif">Annuler la validation</button>';
else b='<button class="btn o" data-a="en" data-i="'+e.id+'" data-v="actif">Activer quand même</button>';
return '<div class="card" style="border-left-color:'+st[1]+'"><h3>'+esc(pr.prenom)+' '+esc(pr.nom)+'</h3><p class="m">'+esc((e.courses||{}).titre)+' · '+esc(pr.email)+'</p><p class="m"><b>'+st[0]+'</b> · demande du '+d(e.created_at)+(e.date_activation?' · activé le '+d(e.date_activation):'')+(e.date_fin?' · terminé le '+d(e.date_fin):'')+(e.mention?' · '+esc(e.mention):'')+'</p>'+(tot?'<p>'+dn+' / '+tot+' leçons'+(m==null?'':' · score moyen '+m+' %')+'</p>':'')+b+'</div>'}).join('')}
async function vUsr(){var U=await A.q('profiles?select=*&order=created_at.desc');
$('V').innerHTML='<p class="m">Pour créer un compte formateur : la personne crée d\'abord un compte sur la page Espace apprenant, puis vous lui attribuez ici le rôle « Formateur ». Un formateur crée ses cours, active les accès et valide les fins de formation.</p>'+U.map(function(u){return '<div class="card"><h3>'+esc(u.prenom)+' '+esc(u.nom)+'</h3><p class="m">'+esc(u.email)+'</p><select data-r="'+u.id+'" aria-label="Rôle">'+['apprenant','responsable','gestionnaire','admin'].map(function(r){return '<option value="'+r+'"'+(r==u.role?' selected':'')+'>'+RL[r]+'</option>'}).join('')+'</select></div>'}).join('')}
var ACT={

p:async function(i,b){await A.q('courses?id=eq.'+i,'PATCH',{publie:b.dataset.v=='1'},'return=minimal');vCrs()},

vdel:async function(i){if(confirm('Supprimer cette vidéo ?')){await A.q('videos?id=eq.'+i,'DELETE',null,'return=minimal');vVid()}},
en:async function(i,b){var v=b.dataset.v,o={statut:v};if(v=='actif')o.date_activation=new Date().toISOString();if(v=='actif'||v=='demande'){o.date_fin=null;o.mention=null}if(v=='demande')o.date_activation=null;
await A.q('enrollments?id=eq.'+i,'PATCH',o,'return=minimal');vAcc()},

await A.q('enrollments?id=eq.'+i,'PATCH',{statut:'termine',date_fin:new Date().toISOString(),mention:m.trim()||null,valide_par:A.uid()},'return=minimal');vAcc()},
