<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Attestation de formation – Fahimta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.att{background:#fff;color:#14213d;border:10px double #2b579a;padding:clamp(18px,5vw,48px);margin:18px 0;text-align:center;aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1.4vw,12px)}
.att .org{font:800 clamp(15px,2.6vw,22px) "Bricolage Grotesque",sans-serif;color:#2b579a;letter-spacing:.04em}
.att .t{font:800 clamp(24px,5.5vw,46px) "Bricolage Grotesque",sans-serif;margin:clamp(4px,2vw,16px) 0}
.att .n{font:800 clamp(20px,4.4vw,36px) "Bricolage Grotesque",sans-serif;color:#2b579a;border-bottom:2px solid #dbe2ee;display:inline-block;padding:0 18px 4px;margin:0 auto}
.att .c{font:800 clamp(17px,3.2vw,26px) "Bricolage Grotesque",sans-serif}
.att p{margin:0;font-size:clamp(13px,2vw,17px)}
.att .sig{display:flex;justify-content:space-between;margin-top:clamp(10px,3vw,30px);font-size:clamp(12px,1.8vw,15px);text-align:left;gap:12px}
.att .sig div:last-child{text-align:right}
.no-print{margin:10px 0}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}.no-print{display:none!important}.w{max-width:none;padding:0}.att{margin:0;height:180mm;aspect-ratio:auto}}
</style>
</head>
<body>
<div class="w" style="max-width:900px">
<p class="no-print"><a href="espace.html#att" style="font-weight:600">← Mes attestations</a></p>
<div id="Z"><p class="m">Chargement…</p></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function(){var id=+new URLSearchParams(location.search).get('e'),Z=$('Z');
if(!A.tok){Z.innerHTML='<p class="ko">Connectez-vous d\'abord dans l\'<a href="espace.html">Espace apprenant</a>.</p>';return}
try{var e=(await A.q('enrollments?id=eq.'+id+'&select=*,courses(titre),profiles!enrollments_user_id_fkey(nom,prenom)'))[0];
if(!e){Z.innerHTML='<p class="ko">Attestation introuvable.</p>';return}
if(e.statut!='termine'){Z.innerHTML='<p class="ko">Cette formation n\'est pas encore validée par le formateur : l\'attestation n\'est pas disponible.</p>';return}
var p=e.profiles||{},d=function(s){return s?new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):''},no='FSI-'+String(e.id).padStart(5,'0');
document.title='Attestation '+no+' – '+(p.prenom||'')+' '+(p.nom||'');
Z.innerHTML='<div class="no-print"><button class="btn" onclick="print()">Imprimer ou enregistrer en PDF</button><p class="m">Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF » pour obtenir un fichier.</p></div>'+
'<div class="att"><div class="org">FAHIMTA SERVICE INFORMATIQUE</div><div class="t">Attestation de formation</div><p>Nous attestons que</p><div class="n">'+esc((p.prenom||'')+' '+(p.nom||'').toUpperCase())+'</div><p>a suivi avec succès la formation</p><div class="c">'+esc((e.courses||{}).titre)+'</div>'+
'<p>'+(e.date_activation?'du '+d(e.date_activation)+' ':'')+'au '+d(e.date_fin)+(e.mention?' · '+esc(e.mention):'')+'</p>'+
'<div class="sig"><div>Attestation n° <b>'+no+'</b><br>Délivrée le '+d(e.date_fin)+'</div><div>Le formateur<br><br>Fahimta Service Informatique</div></div></div>'}
catch(x){Z.innerHTML='<p class="ko">Erreur : '+esc(x.message)+'</p>'}})();
</script>
</body>
</html>
