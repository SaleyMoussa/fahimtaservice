*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}

details{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;margin-bottom:12px}

.m{border-top:1px solid var(--line);padding:10px 0}
